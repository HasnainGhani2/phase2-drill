name: CI

on: 
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  html-validate:
  name: HTML validate
  runs-on:  ubuntu-latest
  steps:
    -name: Checkout code
      uses: actions/checkout@v4

    -name:  Setup Node.js
      uses: actions/Setup-node@v4
      with:
        node-version: 22
      
    -name:  Validate HTML
      run: npx --yes html-validate@9 "**/*.html"
      